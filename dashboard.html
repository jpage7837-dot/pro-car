<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Dashboard — Pro Car</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
  </head>
  <body class="bg-dark text-light">
    <nav
      class="navbar navbar-expand-lg navbar-dark bg-black border-bottom border-secondary mb-4"
    >
      <div class="container">
        <a class="navbar-brand fw-bold" href="index.html"
          ><span class="text-warning">Pro</span>Car</a
        >
        <div class="ms-auto d-flex gap-2">
          <span id="user-email" class="nav-link"></span>
          <button id="logout-btn" class="btn btn-outline-warning btn-sm">
            Logout
          </button>
        </div>
      </div>
    </nav>

    <div class="container">
      <div
        class="modal fade"
        id="paymentMethodModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog modal-sm">
          <div class="modal-content bg-secondary border-secondary">
            <div class="modal-header">
              <h5 class="modal-title">Pay Booking</h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <form id="payment-method-form">
              <div class="modal-body">
                <input type="hidden" id="payment-booking-id" />
                <div class="mb-3">
                  <label class="form-label">Choose payment method</label>
                  <select
                    id="payment-method-select"
                    class="form-select bg-dark text-light border-secondary"
                    required
                  >
                    <option value="">Select method</option>
                    <option value="cash">Cash</option>
                    <option value="mpesa">M-Pesa</option>
                    <option value="paypal">PayPal</option>
                    <option value="card">Card</option>
                    <option value="visa">Visa</option>
                  </select>
                </div>
                <div class="mb-3">
                  <label id="payment-reference-label" class="form-label"
                    >Reference</label
                  >
                  <input
                    id="payment-reference-input"
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    placeholder="Enter phone number or card number"
                  />
                </div>
                <div class="small text-secondary">
                  Amount:
                  <strong id="payment-modal-amount" class="text-warning"
                    >$0</strong
                  >
                </div>
              </div>
              <div class="modal-footer border-0">
                <button
                  type="button"
                  class="btn btn-outline-light"
                  data-bs-dismiss="modal"
                >
                  Cancel
                </button>
                <button
                  type="submit"
                  class="btn btn-warning text-dark fw-semibold"
                >
                  Record Payment
                </button>
              </div>
            </form>
          </div>
        </div>
      </div>

      <div
        class="modal fade"
        id="customerBookingModal"
        tabindex="-1"
        aria-hidden="true"
      >
        <div class="modal-dialog">
          <div class="modal-content bg-secondary border-secondary">
            <div class="modal-header">
              <h5 class="modal-title">Book This Car</h5>
              <button
                type="button"
                class="btn-close btn-close-white"
                data-bs-dismiss="modal"
                aria-label="Close"
              ></button>
            </div>
            <div class="modal-body">
              <div id="booking-form-step">
                <form id="customer-booking-form">
                  <input type="hidden" id="customer-booking-car-id" />
                  <div class="mb-3">
                    <label class="form-label">Start Date</label>
                    <input
                      id="customer-start-date"
                      type="datetime-local"
                      class="form-control bg-dark text-light border-secondary"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">End Date</label>
                    <input
                      id="customer-end-date"
                      type="datetime-local"
                      class="form-control bg-dark text-light border-secondary"
                      required
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-label">Pickup Location</label>
                    <input
                      id="customer-pickup-location"
                      type="text"
                      class="form-control bg-dark text-light border-secondary"
                      placeholder="e.g. Nairobi Airport"
                    />
                  </div>
                  <div class="mb-3">
                    <label class="form-check">
                      <input
                        id="customer-need-driver"
                        type="checkbox"
                        class="form-check-input"
                      />
                      <span class="form-check-label"
                        >I need a driver (+$25)</span
                      >
                    </label>
                  </div>
                  <div class="mb-3">
                    <p class="mb-0">
                      Total Price:
                      <strong class="text-warning" id="customer-total-price"
                        >$0</strong
                      >
                    </p>
                  </div>
                  <button
                    type="submit"
                    class="btn btn-warning text-dark fw-semibold w-100"
                  >
                    Review Booking
                  </button>
                </form>
              </div>

              <div id="booking-review-step" class="d-none">
                <div class="card bg-dark border-secondary p-3 mb-3">
                  <h6 class="text-warning mb-3">Review Your Booking Request</h6>
                  <div
                    id="booking-review-summary"
                    class="small text-light"
                  ></div>
                </div>
                <div class="d-flex gap-2">
                  <button
                    id="booking-edit-btn"
                    type="button"
                    class="btn btn-outline-light flex-grow-1"
                  >
                    Edit Details
                  </button>
                  <button
                    id="booking-confirm-btn"
                    type="button"
                    class="btn btn-warning text-dark fw-semibold flex-grow-1"
                  >
                    Send to Admin
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>

      <!-- Tabs Navigation -->
      <ul
        class="nav nav-tabs nav-tabs-dark border-secondary mb-4"
        role="tablist"
      >
        <li class="nav-item" role="presentation">
          <button
            class="nav-link active text-warning"
            id="bookings-tab"
            data-bs-toggle="tab"
            data-bs-target="#bookings"
            type="button"
            role="tab"
          >
            My Bookings
          </button>
        </li>
        <li class="nav-item" role="presentation">
          <button
            class="nav-link text-secondary"
            id="cars-tab"
            data-bs-toggle="tab"
            data-bs-target="#cars"
            type="button"
            role="tab"
          >
            Browse Cars
          </button>
        </li>
        <li
          class="nav-item"
          id="driver-tab-li"
          role="presentation"
          style="display: none"
        >
          <button
            class="nav-link text-secondary"
            id="driver-tab"
            data-bs-toggle="tab"
            data-bs-target="#driver-portal"
            type="button"
            role="tab"
          >
            Driver Portal
          </button>
        </li>
        <li
          class="nav-item"
          id="company-tab-li"
          role="presentation"
          style="display: none"
        >
          <button
            class="nav-link text-secondary"
            id="company-tab"
            data-bs-toggle="tab"
            data-bs-target="#company-portal"
            type="button"
            role="tab"
          >
            Company Portal
          </button>
        </li>
        <li
          class="nav-item"
          id="admin-tab-li"
          role="presentation"
          style="display: none"
        >
          <button
            class="nav-link text-secondary"
            id="admin-tab"
            data-bs-toggle="tab"
            data-bs-target="#admin"
            type="button"
            role="tab"
          >
            Admin Panel
          </button>
        </li>
        <li
          class="nav-item"
          id="admin-notifications-tab-li"
          role="presentation"
          style="display: none"
        >
          <button
            class="nav-link text-secondary"
            id="admin-notifications-tab"
            data-bs-toggle="tab"
            data-bs-target="#admin-notifications-pane"
            type="button"
            role="tab"
          >
            Notifications
            <span id="admin-notification-count" class="badge bg-danger">0</span>
          </button>
        </li>
      </ul>

      <!-- Tab Content -->
      <div class="tab-content">
        <!-- My Bookings -->
        <div class="tab-pane fade show active" id="bookings" role="tabpanel">
          <h2 class="mb-4">My Bookings</h2>
          <div id="bookings-list" class="row gap-3"></div>
          <div
            id="customer-feedback-panel"
            class="card bg-secondary border-secondary p-3 mt-4 d-none"
          >
            <h5 class="text-warning">Leave Feedback</h5>
            <form id="customer-feedback-form" class="row g-2">
              <div class="col-md-3">
                <select
                  id="customer-feedback-rating"
                  class="form-select bg-dark text-light border-secondary"
                  required
                >
                  <option value="5">5 stars</option>
                  <option value="4">4 stars</option>
                  <option value="3">3 stars</option>
                  <option value="2">2 stars</option>
                  <option value="1">1 star</option>
                </select>
              </div>
              <div class="col-md-7">
                <input
                  id="customer-feedback-comment"
                  class="form-control bg-dark text-light border-secondary"
                  placeholder="Tell us about your rental"
                  required
                />
              </div>
              <div class="col-md-2">
                <button class="btn btn-warning text-dark w-100" type="submit">
                  Submit
                </button>
              </div>
            </form>
          </div>
        </div>

        <!-- Browse Cars -->
        <div class="tab-pane fade" id="cars" role="tabpanel">
          <h2 class="mb-4">Available Cars</h2>
          <div id="cars-list" class="row gap-3"></div>
        </div>

        <!-- Driver Portal -->
        <div class="tab-pane fade" id="driver-portal" role="tabpanel">
          <h2 class="mb-4">Driver Portal</h2>
          <div
            id="driver-portal-content"
            class="card bg-secondary border-secondary p-4"
          ></div>
        </div>

        <!-- Company Portal -->
        <div class="tab-pane fade" id="company-portal" role="tabpanel">
          <h2 class="mb-4">Company Portal</h2>
          <div
            id="company-portal-content"
            class="card bg-secondary border-secondary p-4"
          ></div>
        </div>

        <!-- Admin Notifications -->
        <div
          class="tab-pane fade"
          id="admin-notifications-pane"
          role="tabpanel"
        >
          <h2 class="mb-4">Notifications</h2>
          <div id="admin-notifications-list"></div>
        </div>

        <!-- Admin Panel -->
        <div class="tab-pane fade" id="admin" role="tabpanel">
          <h2 class="mb-4">Admin Panel</h2>
          <ul class="nav nav-pills mb-3" role="tablist">
            <li class="nav-item">
              <button
                class="nav-link active"
                id="admin-cars-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-cars"
                type="button"
              >
                Manage Cars
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-bookings-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-bookings"
                type="button"
              >
                Manage Bookings
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-pending-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-pending"
                type="button"
              >
                Pending Approvals
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-users-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-users"
                type="button"
              >
                Manage Users
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-driver-cvs-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-driver-cvs"
                type="button"
              >
                Driver CVs
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-reviews-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-reviews"
                type="button"
              >
                Customer Reviews
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-reports-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-reports"
                type="button"
              >
                Reports
              </button>
            </li>
            <li class="nav-item">
              <button
                class="nav-link"
                id="admin-payments-tab"
                data-bs-toggle="pill"
                data-bs-target="#admin-payments"
                type="button"
              >
                Payments
              </button>
            </li>
          </ul>

          <!-- Admin Cars -->
          <div class="tab-content">
            <div class="tab-pane fade show active" id="admin-cars">
              <div class="row mb-4">
                <div class="col-md-4">
                  <form
                    id="admin-car-form"
                    class="card bg-secondary border-secondary p-3"
                  >
                    <h5 class="mb-3">Add/Edit Car</h5>
                    <input type="hidden" id="admin-car-id" />
                    <div class="mb-2">
                      <input
                        id="admin-make"
                        type="text"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Make"
                        required
                      />
                    </div>
                    <div class="mb-2">
                      <input
                        id="admin-model"
                        type="text"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Model"
                        required
                      />
                    </div>
                    <div class="mb-2">
                      <input
                        id="admin-year"
                        type="number"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Year"
                        required
                      />
                    </div>
                    <div class="mb-2">
                      <select
                        id="admin-category"
                        class="form-select form-select-sm bg-dark text-light border-secondary"
                      >
                        <option value="Economy">Economy</option>
                        <option value="Sedan">Sedan</option>
                        <option value="SUV">SUV</option>
                        <option value="Luxury">Luxury</option>
                      </select>
                    </div>
                    <div class="mb-2">
                      <input
                        id="admin-price"
                        type="number"
                        step="0.01"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Price/Day"
                        required
                      />
                    </div>
                    <div class="mb-2">
                      <input
                        id="admin-location"
                        type="text"
                        class="form-control form-control-sm bg-dark text-light border-secondary"
                        placeholder="Location (e.g. Nationwide, Lagos)"
                      />
                    </div>
                    <div class="mb-2">
                      <label class="form-check">
                        <input
                          id="admin-available"
                          type="checkbox"
                          class="form-check-input"
                          checked
                        />
                        <span class="form-check-label">Available</span>
                      </label>
                    </div>
                    <button
                      type="submit"
                      class="btn btn-warning text-dark btn-sm fw-semibold"
                    >
                      Save
                    </button>
                  </form>
                </div>
                <div class="col-md-8">
                  <div id="admin-cars-list" class="row gap-2"></div>
                </div>
              </div>
            </div>

            <!-- Admin Bookings -->
            <div class="tab-pane fade" id="admin-bookings">
              <div id="admin-bookings-list" class="row gap-3"></div>
            </div>

            <!-- Pending Approvals -->
            <div class="tab-pane fade" id="admin-pending">
              <div id="admin-pending-list" class="row gap-3"></div>
            </div>

            <!-- Admin Users -->
            <div class="tab-pane fade" id="admin-users">
              <div id="admin-users-list" class="row gap-3"></div>
            </div>

            <!-- Driver CVs -->
            <div class="tab-pane fade" id="admin-driver-cvs">
              <p class="small text-secondary mb-3">
                Driver CV files are stored in <code>uploads/driver-cvs/</code>.
              </p>
              <div id="admin-driver-cvs-list" class="row gap-3"></div>
            </div>

            <!-- Customer Reviews -->
            <div class="tab-pane fade" id="admin-reviews">
              <div id="admin-reviews-list" class="row gap-3"></div>
            </div>

            <div class="tab-pane fade" id="admin-reports">
              <div id="admin-reports-content" class="row g-3"></div>
            </div>

            <div class="tab-pane fade" id="admin-payments">
              <div id="admin-payments-list" class="row gap-3"></div>
            </div>
          </div>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/api.js?v=20260721"></script>
    <script src="js/dashboard.js?v=20260721"></script>
  </body>
</html>
