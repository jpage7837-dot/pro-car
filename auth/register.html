<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Register — Pro Car</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../css/style.css" />
  </head>
  <body
    class="bg-dark text-light d-flex align-items-center justify-content-center min-vh-100"
  >
    <div class="container">
      <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
          <div class="card bg-secondary border border-secondary mb-4">
            <div class="card-body p-4">
              <h2 class="text-center mb-4">Create Account</h2>
              <form id="register-form">
                <div class="mb-3">
                  <label class="form-label">Full Name</label>
                  <input
                    id="name"
                    type="text"
                    class="form-control bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Email</label>
                  <input
                    id="email"
                    type="email"
                    class="form-control bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Phone</label>
                  <input
                    id="phone"
                    type="tel"
                    class="form-control bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Password</label>
                  <input
                    id="password"
                    type="password"
                    class="form-control bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Confirm Password</label>
                  <input
                    id="password2"
                    type="password"
                    class="form-control bg-dark text-light border-secondary"
                    required
                  />
                </div>
                <div class="mb-3">
                  <label class="form-label">Register as</label>
                  <select
                    id="role"
                    class="form-select bg-dark text-light border-secondary"
                  >
                    <option value="1">Customer</option>
                    <option value="2">Driver</option>
                    <option value="3">Company</option>
                  </select>
                  <small class="text-secondary"
                    >Driver and company accounts require admin approval before
                    login.</small
                  >
                </div>
                <div id="driver-cv-group" class="mb-3 d-none">
                  <label class="form-label">Upload CV</label>
                  <input
                    id="driver-cv"
                    type="file"
                    class="form-control bg-dark text-light border-secondary"
                    accept=".pdf,.doc,.docx"
                  />
                  <small class="text-secondary"
                    >Drivers must upload a CV so the admin can review it before
                    approval.</small
                  >
                </div>
                <button
                  type="submit"
                  class="btn btn-warning text-dark fw-semibold w-100 mb-3"
                >
                  Register
                </button>
              </form>
              <div
                id="error-msg"
                class="alert alert-danger d-none"
                role="alert"
              ></div>
              <p class="text-center text-secondary mb-0">
                Already have an account?
                <a href="login.html" class="text-warning">Sign in here</a>
              </p>
            </div>
          </div>
          <div class="text-center">
            <a href="../index.html" class="text-secondary">Back to home</a>
          </div>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/auth.js?v=20260721"></script>
  </body>
</html>
